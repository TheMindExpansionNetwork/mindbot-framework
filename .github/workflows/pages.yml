name: pages

# Publishes site/ to GitHub Pages.
#
# The site lives in site/ rather than at the repo root or in docs/ for two reasons: docs/ is
# already full of markdown that Pages would try to render, and a website at the root buries the
# README that people actually land on. site/ keeps all three concerns separate.
#
# Deploys via the Pages ACTION rather than a gh-pages branch, so there is no second branch to
# keep in sync and no generated artifact committed to history.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a running one mid-publish or the site can be left
# half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Rebuild the doc pages from source
        # The rendered pages are committed, but rebuilding here means a doc edited without
        # re-running the builder still reaches the site — and the build fails loudly if a
        # source listed in PAGES has gone missing.
        run: |
          pip install --quiet markdown
          python site/_build.py

      - name: Check every local link resolves
        # The usual Pages failure is not a broken build. It is a page that deploys perfectly
        # and quietly serves a 404 image or a dead link that nobody notices for a month.
        # This walks EVERY href and src on EVERY page and fails the deploy instead.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          site = pathlib.Path("site")
          bad, checked = [], 0
          for f in site.rglob("*.html"):
              s = f.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'(?:href|src)="((?!https?:|#|mailto:|data:)[^"]+)"', s):
                  href = m.group(1).split("#")[0]
                  if not href:
                      continue
                  checked += 1
                  if not (f.parent / href).resolve().exists():
                      bad.append(f"{f.relative_to(site)}  ->  {href}")
          print(f"{len(list(site.rglob('*.html')))} pages, {checked} local links, {len(bad)} broken")
          for b in bad[:20]:
              print("   ", b)
          sys.exit(1 if bad else 0)
          PY
          ! grep -rq "TODO\|FIXME\|lorem ipsum" site/*.html || { echo "placeholder text"; exit 1; }
          echo "site OK — $(du -sh site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
