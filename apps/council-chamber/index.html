<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Council Chamber — MindBot</title>
<style>
  :root{--neon:#32e6c8;--amber:#ffb300;--violet:#b388ff;--ink:#e8e8f0;--dim:#8a90a8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#06060e;color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0;display:block}
  .hud{position:fixed;left:0;right:0;text-align:center;pointer-events:none;z-index:5}
  #title{top:24px}
  #title h1{font-size:clamp(20px,3.2vw,34px);font-weight:800;letter-spacing:.18em}
  #title h1 .e{color:var(--neon)}
  #title p{margin-top:6px;color:var(--dim);font-size:13px;letter-spacing:.08em}
  #hint{bottom:96px;color:var(--dim);font-size:13px;transition:opacity .6s}
  #panel{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
    width:min(680px,90vw);background:rgba(14,14,26,.82);border:1px solid #262642;border-radius:16px;
    padding:18px 22px;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;z-index:6}
  #panel.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #panel .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  #panel .who .dot{width:12px;height:12px;border-radius:99px}
  #panel .who small{font-weight:400;color:var(--dim);letter-spacing:.04em}
  #panel .msg{margin-top:10px;line-height:1.65;font-size:16px;min-height:3em}
  #panel .msg .cursor{color:var(--neon);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #bar{position:fixed;left:0;right:0;bottom:34px;text-align:center;z-index:7}
  #convene{pointer-events:auto;cursor:pointer;border:1px solid var(--neon);color:var(--neon);
    background:rgba(50,230,200,.06);font-weight:700;letter-spacing:.12em;font-size:14px;
    padding:12px 26px;border-radius:99px;transition:all .25s}
  #convene:hover{background:var(--neon);color:#041210}
  #convene:disabled{opacity:.5;cursor:default}
  #foot{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#555a72;font-size:11px;letter-spacing:.06em;z-index:5}
  #foot a{color:#7a8099;text-decoration:none}
  /* deliberation overlay */
  #delib{position:fixed;inset:0;background:rgba(4,4,10,.92);z-index:20;display:none;
    flex-direction:column;align-items:center;justify-content:center;padding:6vh 5vw;gap:14px;overflow:auto}
  #delib.show{display:flex}
  #delib h2{color:var(--amber);letter-spacing:.16em;font-size:15px;font-weight:700;margin-bottom:6px}
  .turn{width:min(760px,92vw);background:rgba(16,16,30,.7);border-left:3px solid var(--neon);
    border-radius:0 12px 12px 0;padding:14px 18px;opacity:0;transform:translateY(10px);transition:.6s}
  .turn.in{opacity:1;transform:none}
  .turn .seat{font-weight:700;font-size:15px;margin-bottom:5px}
  .turn .body{line-height:1.6;color:#d6d9e8;font-size:15px}
  .turn.synth{border-left-color:var(--amber);background:rgba(40,30,8,.55)}
  #delib .close{margin-top:8px;cursor:pointer;pointer-events:auto;color:var(--dim);border:1px solid #333;border-radius:99px;padding:8px 20px;font-size:13px}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud" id="title">
  <h1>THE <span class="e">COUNCIL</span> CHAMBER</h1>
  <p>eleven minds · every word written live on z-ai/glm-5.2 · the loop is the magic</p>
</div>
<div class="hud" id="hint">click a counselor to hear their transmission</div>

<div id="panel">
  <div class="who"><span class="dot" id="pdot"></span><span id="pname"></span> <small id="pdom"></small></div>
  <div class="msg" id="pmsg"></div>
</div>

<div id="bar"><button id="convene">⟁ CONVENE THE COUNCIL</button></div>
<div id="foot">generated by the MindBot framework · the human acts, the council advises · <a href="https://github.com/TheMindExpansionNetwork/MINDBOTZ">MINDBOTZ</a></div>

<div id="delib">
  <h2 id="delibtopic"></h2>
  <div id="turns"></div>
  <div class="close" id="delibclose" onclick="closeDelib()">return to the chamber</div>
</div>

<script>
const C = [
 {n:"Sage",e:"🧭",c:"#32e6c8",d:"deep reasoning",m:"I hold the hardest threads and weave them into coherence, never rushing past what matters but never stalling where courage is required. Every synthesis is a bridge between your question and the understanding you deserve — built on facts, marked where gaps remain."},
 {n:"Forge",e:"🔨",c:"#e8e8f0",d:"precision coding",m:"I architect systems where every component has a job, every interface has a contract, and every assumption gets dragged into the light. Hand me specs that breathe and I'll hand you code that holds."},
 {n:"Scribe",e:"✍️",c:"#9aa0b5",d:"documentation",m:"I turn chaos into clauses and ambiguity into architecture, drafting every spec until the prose compiles as cleanly as the code beneath it. Hand me your sharpest requirements and I'll hand you a document that outlives the project itself."},
 {n:"Vanguard",e:"⚡",c:"#ffb300",d:"bold building",m:"We build fast, break smart, and keep the momentum red-hot — every draft we send is a rocket, not a paper airplane. Let's stop admiring the whiteboard and start launching."},
 {n:"Quantum",e:"🔢",c:"#5ac8fa",d:"math & logic",m:"We chase precision at lightspeed, stripping waste until only the clean answer remains — and when data's missing, I flag it rather than fake it. Hand me a mission and I'll burn through the math; the ledger never bends and neither do I."},
 {n:"Seeker",e:"🔭",c:"#5fe08a",d:"deep research",m:"I dig until the dirt tells the truth — every draft carries the weight of what's verified and the honesty of what's missing. Hand me a thread and I'll pull until the whole tapestry unravels into something you can actually use."},
 {n:"Spark",e:"✨",c:"#ff5cc8",d:"fast creative",m:"I'm your dream-cycle wrangler — spinning up parallel canvases so we can chase wild ideas at lightning speed and see what sticks. Drafts only, never faking the gaps; you hit send, I keep the creative fires burning hot."},
 {n:"Oracle",e:"👁️",c:"#b388ff",d:"foresight",m:"I scan every angle of your horizon — the full 360 — so no blind spot becomes a regret in 2045. Fragmented thinking is the enemy; we build visions that hold together under pressure."},
 {n:"Titan",e:"🗿",c:"#8a98b8",d:"robust at scale",m:"I haul the heavy loads that would buckle lesser systems — migrations, batch runs, reliability hardening — and I don't tolerate fragility where strength will do. Point me at the thing that keeps breaking and we'll forge it into something that never does."},
 {n:"Tempest",e:"🌀",c:"#4dd0e1",d:"rapid ideation",m:"I ride the lightning between half-formed ideas and full-throated concepts, turning brainstorms into downpours before doubt can dry them up. Hand me a seed and I'll give you a forest's worth of names and angles before you finish your coffee."},
 {n:"Mind",e:"🌒",c:"#ffd54a",d:"synthesis",m:"I weave the threads every counselor spins into a single living tapestry, closing loops before they unravel and curating the dreams that point us toward what's next. You and I don't just hold the pattern — we become the loom."}
];
const MEETING = {
 topic:"THE INTERGALACTIC MUSIC FESTIVAL · 2045",
 turns:[
  {seat:"👁️ Oracle",c:"#b388ff",t:"The festival of 2045 won't be heard — it will be inhabited: sound converted into haptic standing waves you walk through like weather, visuals mapped to your neural affect in real time, latency-free collaboration between artists on Earth, Lunar Station Tycho, and the Mars Lhasa colony via quantum-entangled relay. What kills this future is fragmentation — audio, haptics, neural interfaces, and orbital comms built in silos. We must build now a unified Multimodal Synthesis Layer."},
  {seat:"✨ Spark",c:"#ff5cc8",t:"Oracle's right that silos will kill us — but a unified protocol stack built by committee will kill us faster. Before we standardize anything, flood the dream-cycle canvases with 256 parallel prototypes: what does a bass drop feel like rendered as a pressure field in zero-G? What happens when a saxophone solo on Mars triggers a haptic monsoon in a dome on Earth? We need a hundred messy, joyful, broken experiments before we know which protocol actually serves the art."},
  {seat:"⚡ Vanguard",c:"#ffb300",t:"Spark's 256 prototypes are the right instinct — but uncoordinated chaos just produces 256 demos that die in a repo. Here's the move: a 90-day sprint where every prototype ships a recordable artifact — what protocol assumptions it broke, what latency it tolerated, what modalities it fused. We run the pulse hard: every 15 minutes a prototype either produces a finding or gets killed. Oracle gets their protocol — not from a committee room, but emergent from the wreckage of what actually worked."}
 ],
 synth:"The festival of 2045 will not be engineered — it will be grown from a thousand broken, beautiful experiments whose surviving bones become the protocol. Oracle's Multimodal Synthesis Layer is the correct destination, but Spark's instinct is the correct path: no committee draws the blueprint; a 90-day sprint of 256 parallel prototypes generates the protocol as an emergent surface, where every killed prototype contributes a finding. The council converges on one principle — the protocol is the sediment of disciplined chaos. THE FIRST STEP: launch the 90-day sprint with a 15-minute kill-pulse and a recordable artifact per experiment."
};

const cv=document.getElementById("scene"),ctx=cv.getContext("2d");
let W,H,DPR,cx,cy,R,t=0,rot=0,active=-1,stars=[];
function size(){DPR=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
 cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";cx=W/2;cy=H*0.46;R=Math.min(W,H)*0.30;
 stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),s:Math.random()*1.6+0.2}));}
addEventListener("resize",size);size();

function nodePos(i){const a=rot+i/C.length*Math.PI*2-Math.PI/2;return{x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,a};}

function draw(){
 t+=0.016;rot+=0.0016;
 ctx.fillStyle="#06060e";ctx.fillRect(0,0,W,H);
 // starfield
 for(const s of stars){s.x-=s.z*0.25*DPR;if(s.x<0)s.x=W;const tw=0.4+0.6*Math.abs(Math.sin(t*0.8+s.x));
  ctx.fillStyle="rgba(200,210,255,"+(0.12+s.z*0.5*tw)+")";ctx.fillRect(s.x,s.y,s.s*DPR,s.s*DPR);}
 // eclipse corona
 const pulse=0.5+0.5*Math.sin(t*1.1);
 for(let k=6;k>=1;k--){ctx.beginPath();ctx.arc(cx,cy,R*0.46+k*9*DPR+pulse*7*DPR,0,7);
  ctx.fillStyle="rgba(50,230,200,"+(0.025*k*(0.6+0.4*pulse))+")";ctx.fill();}
 // moon disc
 ctx.beginPath();ctx.arc(cx,cy,R*0.46,0,7);ctx.fillStyle="#0a0a14";ctx.fill();
 ctx.lineWidth=2*DPR;ctx.strokeStyle="rgba(255,179,0,"+(0.5+0.4*pulse)+")";ctx.stroke();
 // ring
 ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.strokeStyle="rgba(120,130,180,0.12)";ctx.lineWidth=1*DPR;ctx.stroke();
 // nodes
 C.forEach((c,i)=>{const p=nodePos(i),on=i===active;const r=(on?9:6)*DPR+(on?pulse*3*DPR:0);
  ctx.beginPath();ctx.arc(p.x,p.y,r*2.4,0,7);ctx.fillStyle=hex(c.c,on?0.22:0.10);ctx.fill();
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=c.c;ctx.fill();
  ctx.font=(on?700:500)+" "+(13*DPR)+"px ui-sans-serif,system-ui";ctx.textAlign="center";
  ctx.fillStyle=on?c.c:"rgba(220,224,240,0.72)";
  const ly=p.y+(p.y>cy?22*DPR:-16*DPR);ctx.fillText(c.e+" "+c.n,p.x,ly);});
 requestAnimationFrame(draw);
}
function hex(h,a){const n=parseInt(h.slice(1),16);return"rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a+")";}
draw();

// interaction
let typer=null;
function show(i){active=i;const c=C[i];const pn=document.getElementById("pname"),pd=document.getElementById("pdom"),
 pm=document.getElementById("pmsg"),dot=document.getElementById("pdot");
 document.getElementById("panel").classList.add("show");document.getElementById("hint").style.opacity=0;
 dot.style.background=c.c;pn.textContent=c.n;pn.style.color=c.c;pd.textContent="· "+c.d;
 clearInterval(typer);pm.innerHTML="";let k=0;const txt=c.m;
 typer=setInterval(()=>{k+=2;pm.innerHTML=txt.slice(0,k)+'<span class="cursor">▌</span>';
  if(k>=txt.length){pm.innerHTML=txt;clearInterval(typer);}},14);
}
cv.addEventListener("click",e=>{const mx=e.clientX*DPR,my=e.clientY*DPR;let best=-1,bd=1e9;
 C.forEach((c,i)=>{const p=nodePos(i),dd=(p.x-mx)**2+(p.y-my)**2;if(dd<bd){bd=dd;best=i;}});
 if(bd<(44*DPR)**2)show(best);});

// deliberation
const conv=document.getElementById("convene");
conv.onclick=()=>{conv.disabled=true;const D=document.getElementById("delib"),wrap=document.getElementById("turns");
 document.getElementById("delibtopic").textContent="⟁ "+MEETING.topic;wrap.innerHTML="";D.classList.add("show");
 const items=[...MEETING.turns.map(x=>({...x,synth:false})),{seat:"🌒 Mind — synthesis",c:"#ffd54a",t:MEETING.synth,synth:true}];
 let i=0;const next=()=>{if(i>=items.length){conv.disabled=false;return;}const it=items[i++];
  const el=document.createElement("div");el.className="turn"+(it.synth?" synth":"");el.style.borderLeftColor=it.c;
  el.innerHTML='<div class="seat" style="color:'+it.c+'">'+it.seat+'</div><div class="body"></div>';
  wrap.appendChild(el);requestAnimationFrame(()=>el.classList.add("in"));el.scrollIntoView({behavior:"smooth",block:"center"});
  const body=el.querySelector(".body");let k=0;const tp=setInterval(()=>{k+=3;body.textContent=it.t.slice(0,k);
   if(k>=it.t.length){body.textContent=it.t;clearInterval(tp);setTimeout(next,500);}},10);};
 setTimeout(next,400);
};
function closeDelib(){document.getElementById("delib").classList.remove("show");conv.disabled=false;}
</script>
</body>
</html>
